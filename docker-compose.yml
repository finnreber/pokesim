services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pokesim
      POSTGRES_USER: pokesim
      POSTGRES_PASSWORD: pokesim
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokesim"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/pokesim
      DB_USER: pokesim
      DB_PASSWORD: pokesim
    ports: ["8080:8080"]

volumes:
  pgdata:
