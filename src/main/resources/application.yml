spring:
  application:
    name: pokesim
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokesim}
    username: ${DB_USER:pokesim}
    password: ${DB_PASSWORD:pokesim}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches the entities
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true   # Spring's own errors (bad params etc.) use the same RFC 9457 format

app:
  jwt:
    # HS256 needs >= 32 bytes. This default is for local dev ONLY: set JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
    ttl-minutes: ${JWT_TTL_MINUTES:60}

  rate-limit:
    enabled: true
    auth:     { requests: 10,  per-seconds: 60 }    # register + login, per IP
    simulate: { requests: 6,   per-seconds: 60 }    # public simulation, per IP
    api:      { requests: 120, per-seconds: 60 }    # everything else under /api, per IP

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}
  # Behind Render's proxy: restore the real client IP (for rate limiting) and the https scheme (for Swagger's URLs).
  forward-headers-strategy: native
